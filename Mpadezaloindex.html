  <header className="sticky z-50 bg-page/80 backdrop-blur-xl backdrop-saturate-150 border-b border-line/60" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>

        <span className="font-semibold text-[15px] tracking-tight">Mpandezalo</span>
      </a>
      <nav className="hidden md:flex items-center gap-8 text-[14px] text-ink/80" aria-label="Main">
        ${NAV.map(([l, h]) => html`<a key=${h} href=${h} className="hover:text-ink transition-colors">${l}</a>`)}
      </nav>
      <div className="flex items-center gap-1">
        <a href="#quote" className="hidden sm:inline-flex rounded-full bg-emerald hover:bg-emerald-hover text-white text-[13px] font-medium px-4 py-1.5 transition-colors">Get a quote</a>
        <button className="md:hidden p-2 -mr-2" aria-label=${open ? 'Close menu' : 'Open menu'} aria-expanded=${open} onClick=${() => setOpen(!open)}><${Icon} name=${open ? 'close' : 'menu'} className="w-6 h-6" /></button>
      </div>
    <//>
    <${AnimatePresence}>
      ${open && html`<${motion.nav} key="m" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }} transition=${{ duration: .2 }} className="md:hidden fixed inset-x-0 top-14 bottom-0 bg-page px-8 pt-6" aria-label="Mobile">
        ${[...NAV, ['Get a quote', '#quote']].map(([l, h], i) => html`<${motion.a} key=${l} href=${h} onClick=${() => setOpen(false)} initial=${{ opacity: 0, y: -8 }} animate=${{ opacity: 1, y: 0 }} transition=${{ delay: .03 * i }} className="block py-3 text-3xl font-semibold">${l}<//>`)}
      <//>`}
    <//>
  </header>`;
}

function Segmented({ options, value, onChange, label }) {

/* ---------- Map ---------- */
function useTransform(key) {
  const b = MAP.boxes;
  const names = AREAS[key].provs;
  const x0 = Math.min(...names.map(n => b[n][0])), y0 = Math.min(...names.map(n => b[n][1]));
  const x1 = Math.max(...names.map(n => b[n][2])), y1 = Math.max(...names.map(n => b[n][3]));
  if (key === 'all') return { s: 1, tx: 0, ty: 0 };
  const pad = 1.6;
  const s = Math.min(MAP.W / ((x1 - x0) * pad), MAP.H / ((y1 - y0) * pad), 4.2);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { s, tx: MAP.W / 2 - s * cx, ty: MAP.H / 2 - s * cy };
}
function Areas() {
  const [sel, setSel] = useState('all');
  const a = AREAS[sel];
  const { s, tx, ty } = useTransform(sel);
  const served = ['Gauteng', 'KwaZulu-Natal', 'Mpumalanga'];
  const keyOf = { Gauteng: 'gp', 'KwaZulu-Natal': 'kzn', Mpumalanga: 'mp' };
  const fill = n => !served.includes(n) ? 'rgb(var(--map-off))' : (sel === 'all' || a.provs.includes(n)) ? 'rgb(var(--map-on))' : 'rgb(var(--map-dim))';
  return html`
  <section id="areas" className="bg-alt py-24 sm:py-32">
    <${Wrap}>
      <${Reveal}><${Title} center sub="Gauteng, KwaZulu-Natal and Mpumalanga. Projects elsewhere are quoted on request.">Where we work.<//><//>
      <div className="flex justify-center mb-8 overflow-x-auto"><${Segmented} label="Province" value=${sel} onChange=${setSel} options=${Object.entries(AREAS).map(([k, v]) => [k, v.short])} /></div>
      <div className="rounded-[2rem] bg-page overflow-hidden">
        <div className="relative">
          <svg viewBox=${`0 0 ${MAP.W} ${MAP.H}`} className="w-full h-auto block" role="img" aria-label=${'Map of South Africa highlighting ' + a.name}>
            <g className="map-g" style=${{ transform: `translate(${tx}px, ${ty}px) scale(${s})` }}>
              ${Object.entries(MAP.paths).map(([n, d]) => {
                const k = keyOf[n];
                return html`<path key=${n} d=${d} fillRule="evenodd" className=${'prov' + (k ? ' cursor-pointer' : '')} fill=${fill(n)} stroke="rgb(var(--page))" strokeWidth="1.2" vectorEffect="non-scaling-stroke" strokeLinejoin="round"
                  onClick=${k ? () => setSel(sel === k ? 'all' : k) : undefined}><title>${n}</title></path>`;
              })}
              ${sel !== 'all' && a.hubs.map(([c, anchor]) => {
                const [x, y] = MAP.cities[c];
                return html`<g key=${c} style=${{ pointerEvents: 'none' }}>
                  <circle cx=${x} cy=${y} r=${4.5 / s} fill="#fff" stroke="#0B2545" strokeWidth=${2 / s} />
                  <text x=${x + (anchor === 'end' ? -9 : 9) / s} y=${y + 4.5 / s} textAnchor=${anchor} fontSize=${14 / s} fontWeight="600" fill="#0B2545" stroke="rgba(255,255,255,.92)" strokeWidth=${4 / s} strokeLinejoin="round" paintOrder="stroke" fontFamily="-apple-system, Inter, Arial, sans-serif">${c}</text>
                </g>`;
              })}
            </g>
          </svg>
        </div>
        <${AnimatePresence} mode="wait">
          <${motion.div} key=${sel} initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }} transition=${{ duration: .25 }} className="border-t border-line/60 px-6 sm:px-10 py-6 sm:py-7 flex flex-col sm:flex-row sm:items-center gap-4 justify-between">
            <div>
              <h3 className="text-xl font-semibold">${a.name}</h3>
              <p className="text-muted mt-1">${a.note}</p>
            </div>
            <${Pill} href="#quote">${sel === 'all' ? 'Request a quote' : 'Get a quote in ' + a.short}<//>
          <//>
        <//>
      </div>
    <//>
  </section>`;
}

/* ---------- Quote ---------- */
function Quote() {
  const empty = { name: '', company: '', phone: '', email: '', service: '', message: '' };
  const [f, setF] = useState(empty);
  const [err, setErr] = useState({});
  const [done, setDone] = useState(false);
  const set = k => e => { setF({ ...f, [k]: e.target.value }); if (err[k]) setErr({ ...err, [k]: undefined }); };
  const submit = ev => {
    ev.preventDefault();
    const e = {};
    if (!f.name.trim()) e.name = 'Enter your name.';
    if (f.phone.replace(/\D/g, '').length < 9) e.phone = 'Enter a phone number with at least 9 digits.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = 'Enter an email like name@company.co.za.';
    if (!f.service) e.service = 'Choose a service.';
    setErr(e);
    if (!Object.keys(e).length) setDone(true);
  };
  const body = `Quote request: ${f.service}\n\nName: ${f.name}\nCompany: ${f.company || '-'}\nPhone: ${f.phone}\nEmail: ${f.email}\n\n${f.message}`;
  const wa = `https://wa.me/${PHONE_RAW}?text=${encodeURIComponent(body)}`;
  const mail = `mailto:${EMAIL}?subject=${encodeURIComponent('Quote request: ' + f.service)}&body=${encodeURIComponent(body)}`;
  const box = k => 'w-full rounded-xl bg-alt border px-4 py-3.5 text-[17px] text-ink placeholder:text-muted focus:outline-none focus:bg-page focus:border-accent focus:ring-4 focus:ring-accent/15 transition ' + (err[k] ? 'border-red-500' : 'border-transparent');
  const Err = k => err[k] && html`<p className="mt-1.5 text-sm text-red-600 dark:text-red-400" role="alert">${err[k]}</p>`;
  const In = (k, ph, type = 'text', ac) => html`<div><label className="sr-only" htmlFor=${'q-' + k}>${ph}</label><input id=${'q-' + k} type=${type} placeholder=${ph} value=${f[k]} onChange=${set(k)} autoComplete=${ac} aria-invalid=${!!err[k]} className=${box(k)} />${Err(k)}</div>`;
  return html`
  <section id="quote" className="py-24 sm:py-32">
    <${Wrap}>
      <${Reveal}><${Title} center sub="Tell us what you need and we’ll reply with an itemised quotation.">Request a quote.<//><//>
      <div className="grid lg:grid-cols-[1fr_320px] gap-10 lg:gap-14 items-start">
        <div className="rounded-[2rem] bg-page border border-line/70 p-6 sm:p-10">
          <${AnimatePresence} mode="wait">
          ${!done ? html`
            <${motion.form} key="f" exit=${{ opacity: 0, scale: .98 }} onSubmit=${submit} noValidate className="grid sm:grid-cols-2 gap-3.5">
              ${In('name', 'Name', 'text', 'name')}
              ${In('company', 'Company name (optional)', 'text', 'organization')}
              ${In('phone', 'Phone number', 'tel', 'tel')}
              ${In('email', 'Email', 'email', 'email')}
              <div className="sm:col-span-2">
                <label className="sr-only" htmlFor="q-service">Service required</label>
                <select id="q-service" value=${f.service} onChange=${set('service')} aria-invalid=${!!err.service} className=${box('service') + (f.service ? '' : ' text-muted')}>
                  <option value="">Service required</option>
                  ${SERVICE_OPTIONS.map(o => html`<option key=${o}>${o}</option>`)}
                </select>${Err('service')}
              </div>
              <div className="sm:col-span-2">
                <label className="sr-only" htmlFor="q-msg">Message</label>
                <textarea id="q-msg" rows="4" value=${f.message} onChange=${set('message')} placeholder="Message: quantities, site, frequency, deadline" className=${box('message') + ' resize-y'}></textarea>
              </div>
              <button type="submit" className="sm:col-span-2 mt-2 rounded-full bg-emerald hover:bg-emerald-hover text-white text-[17px] font-medium py-3.5 transition-colors">Request a quote</button>
              <p className="sm:col-span-2 text-center text-[13px] text-muted">Your details are used only to prepare your quotation.</p>
            <//>` : html`
            <${motion.div} key="d" initial=${{ opacity: 0, scale: .96 }} animate=${{ opacity: 1, scale: 1 }} transition=${{ duration: .35, ease }} className="text-center py-8">
              <span className="inline-grid place-items-center w-16 h-16 rounded-full bg-emerald text-white"><${Icon} name="check" className="w-8 h-8" sw=${2.4} /></span>
              <h3 className="mt-6 text-2xl font-semibold">Almost done.</h3>
              <p className="mt-2 text-muted max-w-sm mx-auto">Choose how to send your request. Everything is filled in, so just press send.</p>
              <div className="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
                <a href=${wa} target="_blank" rel="noopener" className="inline-flex items-center justify-center gap-2 rounded-full bg-[#25D366] hover:bg-[#1EBE5A] text-white font-medium px-6 py-3.5"><${WA} className="w-5 h-5" />Send on WhatsApp</a>
                <a href=${mail} target="_blank" rel="noopener" className="inline-flex items-center justify-center gap-2 rounded-full bg-alt font-medium px-6 py-3.5"><${Icon} name="mail" className="w-5 h-5" />Send by email</a>
              </div>
              <button onClick=${() => { setDone(false); setF(empty); }} className="mt-6 text-[15px] text-accent">Start over</button>
            <//>`}
          <//>
        </div>
        <aside id="contact" className="space-y-7 lg:pt-4">
          <div><p className="text-sm text-muted">Call</p><a href=${'tel:+' + PHONE_RAW} className="text-xl font-semibold hover:text-accent">${PHONE}</a></div>
          <div><p className="text-sm text-muted">WhatsApp</p><a href=${'https://wa.me/' + PHONE_RAW} target="_blank" rel="noopener" className="text-xl font-semibold hover:text-accent">Chat with us</a></div>
          <div><p className="text-sm text-muted">Email</p><a href=${'mailto:' + EMAIL} className="text-[17px] font-semibold hover:text-accent break-all">${EMAIL}</a></div>
          <div><p className="text-sm text-muted">Areas</p><p className="text-[17px] font-semibold">Gauteng, KwaZulu-Natal, Mpumalanga</p></div>
        </aside>
      </div>
    <//>
  </section>`;
}

/* ---------- CTA, footer, legal ---------- */
const CTA = () => html`
<section className="bg-alt py-24 sm:py-28 text-center">
  <${Wrap}>
    <img src=${STAMP} alt="" className="w-20 h-20 mx-auto mb-8" />
    <h2 className="text-4xl sm:text-5xl font-semibold leading-[1.08] max-w-3xl mx-auto">Let’s grow together through excellence and opportunity.</h2>
    <div className="mt-9"><${Pill} href="#quote">Request a quote<//></div>
  <//>
</section>`;

const LEGAL = {
  privacy: { title: 'Privacy policy', body: [
    'MPANDEZALO (Pty) Ltd processes personal information in line with the Protection of Personal Information Act (POPIA).',
    'We collect only the details you choose to give us (name, company, phone number, email and service requirements) and use them solely to respond to your enquiry, prepare quotations and deliver agreed services.',
    'We do not sell or share your information, except where needed to deliver a service you requested or where the law requires it.',
    'To access, correct or delete your information, contact ' + EMAIL + '.',
  ] },
  terms: { title: 'Terms & conditions', body: [
    'Information on this website is general. Availability, specifications and pricing are confirmed only in a written quotation.',
    'Quotations are valid for the period stated on them. Orders and services are subject to acceptance of the quotation and any agreed service-level terms.',
    'Delivery timelines depend on location, stock and site access, and are confirmed when an order is accepted.',
    'Questions about these terms: ' + PHONE + ' or ' + EMAIL + '.',
  ] },
};
function Footer({ onLegal }) {
  return html`
  <footer className="bg-alt border-t border-line/60 text-[13px] text-muted">
    <${Wrap} className="py-12">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
        <div className="col-span-2 md:col-span-1 flex items-start gap-3">
          <img src=${STAMP} alt="" className="w-12 h-12" />
          <div><p className="text-ink font-semibold text-[14px]">MPANDEZALO (Pty) Ltd</p><p className="mt-1">I RISE: growing through excellence and opportunity.</p></div>
        </div>
        <div><p className="text-ink font-semibold mb-3">Company</p><ul className="space-y-2"><li><a href="#about" className="hover:text-ink">About us</a></li><li><a href="#process" className="hover:text-ink">How we work</a></li><li><a href="#quote" className="hover:text-ink">Request a quote</a></li></ul></div>
        <div><p className="text-ink font-semibold mb-3">Services</p><ul className="space-y-2">${[...PRODUCTS, ...SERVICES].map(s => html`<li key=${s.title}><a href="#services" className="hover:text-ink">${s.title}</a></li>`)}</ul></div>
        <div><p className="text-ink font-semibold mb-3">Contact</p><ul className="space-y-2"><li><a href=${'tel:+' + PHONE_RAW} className="hover:text-ink">${PHONE}</a></li><li><a href=${'mailto:' + EMAIL} className="hover:text-ink break-all">${EMAIL}</a></li><li>Gauteng, KwaZulu-Natal, Mpumalanga</li></ul></div>
      </div>
      <div className="mt-10 pt-6 border-t border-line/60 flex flex-col sm:flex-row gap-3 justify-between">
        <p>Copyright © ${new Date().getFullYear()} MPANDEZALO (Pty) Ltd. All rights reserved.</p>
        <div className="flex gap-5"><button onClick=${() => onLegal('privacy')} className="hover:text-ink">Privacy Policy</button><button onClick=${() => onLegal('terms')} className="hover:text-ink">Terms & Conditions</button></div>
      </div>
    <//>
  </footer>`;
}
function Sheet({ which, onClose }) {
  useEffect(() => { const k = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const d = LEGAL[which];
  return html`
  <${motion.div} initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }} className="fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4" onClick=${onClose}>
    <${motion.div} role="dialog" aria-modal="true" aria-label=${d.title} initial=${{ y: 40, opacity: 0 }} animate=${{ y: 0, opacity: 1 }} exit=${{ y: 40, opacity: 0 }} transition=${{ duration: .3, ease }} onClick=${e => e.stopPropagation()} className="bg-page text-ink rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-7 sm:p-9 max-h-[85vh] overflow-auto" style=${{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 1.75rem)' }}>
      <div className="flex items-center justify-between gap-4">
        <h2 className="text-2xl font-semibold">${d.title}</h2>
        <button onClick=${onClose} aria-label="Close" className="grid place-items-center w-8 h-8 rounded-full bg-alt text-muted"><${Icon} name="close" className="w-4 h-4" sw=${2.2} /></button>
      </div>
      <div className="mt-5 space-y-4 text-muted leading-relaxed">${d.body.map((p, i) => html`<p key=${i}>${p}</p>`)}</div>
    <//>
  <//>`;
}

function App() {
  const [legal, setLegal] = useState(null);
  return html`
    <a href="#services" className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[80] bg-page px-4 py-2 rounded-full">Skip to content</a>
    <${Header} />
    <main><${Hero} /><${Why} /><${Services} /><${About} /><${Process} /><${Areas} /><${Quote} /><${CTA} /></main>
    <${Footer} onLegal=${setLegal} />
    <a href=${'https://wa.me/' + PHONE_RAW} target="_blank" rel="noopener" aria-label="Chat on WhatsApp" className="fixed right-4 sm:right-6 z-40 grid place-items-center w-14 h-14 rounded-full bg-[#25D366] text-white shadow-[0_6px_20px_rgba(0,0,0,.25)] hover:scale-105 transition-transform" style=${{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 1.25rem)' }}><${WA} className="w-8 h-8" /></a>
    <${AnimatePresence}>${legal && html`<${Sheet} key="legal" which=${legal} onClose=${() => setLegal(null)} />`}<//>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
